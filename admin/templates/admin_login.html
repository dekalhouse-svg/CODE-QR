<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration · QR CODE</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:Arial,sans-serif;background:#f5f3ff;color:#1f1235;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
        .box{width:100%;max-width:420px;background:#fff;border:1px solid #e9d5ff;border-radius:18px;padding:28px;box-shadow:0 10px 35px rgba(76,29,149,.08)}
        h1{margin-bottom:8px}
        p{color:#6b7280;margin-bottom:22px}
        label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}
        input{width:100%;padding:13px;border:1px solid #d8b4fe;border-radius:10px;font-size:15px;outline:none}
        input:focus{border-color:#7c3aed}
        button{width:100%;border:0;border-radius:10px;padding:13px;background:#6d28d9;color:#fff;font-weight:700;font-size:15px;margin-top:20px;cursor:pointer}
        .error{background:#fef2f2;color:#b91c1c;padding:11px;border-radius:9px;font-size:13px;margin-bottom:10px}
        .brand{font-weight:800;color:#6d28d9;margin-bottom:20px}
    </style>
</head>
<body>
    <form class="box" method="post">
        <div class="brand">QR CODE · ADMIN</div>
        <h1>Connexion</h1>
        <p>Accédez au panneau d'administration.</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <label for="username">Nom d'utilisateur</label>
        <input id="username" name="username" autocomplete="username" required>

        <label for="password">Mot de passe</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Se connecter</button>
    </form>
</body>
</html>
